<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat-Codex Workspace</title>
<style>
:root{color-scheme:light dark;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}
body{margin:0;padding:24px;background:var(--bg,#f8fafc);color:var(--fg,#142232);line-height:1.5}
@media(prefers-color-scheme:dark){body{--bg:#111827;--fg:#e2e8f0}}
main{max-width:1024px;margin:auto}header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.emblem{background:#2563eb;color:white;border-radius:12px;padding:14px;font-weight:800}
h1{margin:0;font-size:1.6rem}p{margin:.15rem 0;color:#64748b}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
section{border:1px solid #64748b35;background:color-mix(in srgb,Canvas 96%,#3b82f6 4%);border-radius:14px;padding:16px;min-width:0}
h2{font-size:1rem;margin:0 0 14px}
.item{padding:10px 0;border-bottom:1px solid #64748b30;overflow-wrap:anywhere}
.item:last-child{border:0}.meta{display:block;font-size:.8rem;color:#64748b;margin-top:4px}
code{font-family:ui-monospace,monospace;font-size:.88em}
footer{margin-top:20px;font-size:.8rem;color:#64748b}
</style></head><body>
<main><header><div class="emblem">CC</div><div><h1>Chat-Codex</h1><p>Development workspace � Resource overview</p></div></header>
<div class="grid">
<section><h2>Projects</h2><!--PROJECTS--></section>
<section><h2>Hosts</h2><!--HOSTS--></section>
<section><h2>Disposable Environments</h2><!--ENVIRONMENTS--></section>
<section><h2>Recent Tasks</h2><!--TASKS--></section>
<section><h2>Recent Executions</h2><!--EXECUTIONS--></section>
</div><footer>Read-only snapshot. Use the typed MCP tools to execute commands or manage environments. A disconnected host is not a stopped machine.</footer></main>
</body></html>
