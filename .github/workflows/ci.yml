name: Chat-Codex CI
on:
  push:
  pull_request:
jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
  docker-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: docker pull node:22-bookworm-slim
      - run: npm run test:integration
      - run: npm run test:onboarding
  plugin-extensions-isolated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: docker pull node:22-bookworm-slim
      - name: Real MCP Extensions protocol in isolated disposable container
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 128 --memory 512m \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777 \
            --workdir /workspace node:22-bookworm-slim \
            node --test test/extensions.test.mjs test/plugin.test.mjs
  windows-native-compilation:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile embedded native declarations without desktop access
        run: node --test test/windows-native-compile.test.mjs
